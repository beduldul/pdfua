[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdfua"
version = "0.1.0"
description = "Check the machine-checkable subset of PDF/UA-1 and WCAG 2.1 for PDFs, in pure Python. No JVM."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "beduldul", email = "alkaysan07@gmail.com" }]
keywords = ["pdf", "pdfua", "pdf-ua", "accessibility", "a11y", "wcag", "ada", "section508", "validator", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = ["pikepdf>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/beduldul/pdfua"
Repository = "https://github.com/beduldul/pdfua"
Issues = "https://github.com/beduldul/pdfua/issues"
Changelog = "https://github.com/beduldul/pdfua/blob/main/CHANGELOG.md"

[project.scripts]
pdfua = "pdfua.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfua"]

[tool.hatch.build.targets.sdist]
include = ["src/pdfua", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pdfua"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_explicit = true
files = ["src/pdfua"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG"]
